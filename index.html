<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CorcxAi - עוזר ה-AI שלך</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --chat-bg: #161b22;
            --accent-color: #8b5cf6;
            --accent-hover: #7c3aed;
            --text-color: #f3f4f6;
            --text-secondary: #9ca3af;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 20px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--chat-bg);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #a78bfa, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #status-badge {
            font-size: 0.85rem;
            padding: 6px 12px;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid var(--accent-color);
            border-radius: 20px;
            color: #c4b5fd;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            overflow: hidden;
        }

        #chat-container {
            flex: 1;
            background-color: var(--chat-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 10px;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .message.user {
            background-color: var(--accent-color);
            color: white;
            align-self: flex-start;
            border-bottom-right-radius: 2px;
        }

        .message.bot {
            background-color: #21262d;
            color: var(--text-color);
            align-self: flex-end;
            border-bottom-left-radius: 2px;
            border: 1px solid var(--border-color);
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            background-color: var(--chat-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button {
            padding: 0 24px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">CorcxAi</div>
        <div id="status-badge">טוען מודל AI...</div>
    </header>

    <main>
        <div id="chat-container">
            <div class="message bot">שלום! אני העוזר של CorcxAi. איך אפשר לעזור לך היום? (המודל טוען את עצמו ישירות לדפדפן שלך).</div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="הקלד את הודעתך כאן..." disabled>
            <button id="send-btn" disabled>שלח</button>
        </div>
    </main>

    <script type="module">
        import { CreateWebWorkerMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

        const selectedModel = "Llama-3-8B-Instruct-q4f32_1-MLC";
        let engine;

        const statusBadge = document.getElementById("status-badge");
        const chatContainer = document.getElementById("chat-container");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");

        async function initAI() {
            try {
                engine = await CreateWebWorkerMLCEngine(
                    new Worker(URL.createObjectURL(new Blob([`
                        import { WebWorkerMLCEngineHandler } from "https://esm.run/@mlc-ai/web-llm";
                        const handler = new WebWorkerMLCEngineHandler();
                        onmessage = (msg) => handler.onmessage(msg);
                    `], { type: "javascript/worker" }))),
                    selectedModel,
                    { 
                        initProgressCallback: (report) => {
                            statusBadge.innerText = report.text;
                        } 
                    }
                );
                statusBadge.innerText = "CorcxAi פעיל ומחובר";
                statusBadge.style.borderColor = "#10b981";
                statusBadge.style.color = "#6ee7b7";
                userInput.disabled = false;
                sendBtn.disabled = false;
            } catch (err) {
                statusBadge.innerText = "שגיאה בטעינת המודל";
                console.error(err);
            }
        }

        initAI();

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text || !engine) return;

            // הוספת הודעת משתמש
            appendMessage(text, 'user');
            userInput.value = '';
            
            // יצירת הודעת תשובה ריקה של הבוט
            const botMsgDiv = appendMessage("...", 'bot');

            try {
                const chunks = await engine.chat.completions.create({
                    messages: [{ role: "user", content: text }],
                    stream: true,
                });

                let reply = "";
                for await (const chunk of chunks) {
                    reply += chunk.choices[0]?.delta?.content || "";
                    botMsgDiv.innerText = reply;
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
            } catch (err) {
                botMsgDiv.innerText = "אופס, אירעה שגיאה בעיבוד ההודעה.";
                console.error(err);
            }
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });
    </script>
</body>
</html>
