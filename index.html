<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe SpongeBob Interactive - GitHub Pages</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #010101;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .watermark {
            position: absolute;
            bottom: 25px;
            right: 30px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 13px;
            letter-spacing: 3px;
            pointer-events: none;
            text-transform: uppercase;
        }
        .instructions {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            letter-spacing: 2px;
            pointer-events: none;
            text-transform: uppercase;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(8, 8, 8, 0.95);
            padding: 14px 24px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(12px);
            z-index: 10;
        }
        button {
            background: #050505;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 10px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }
        button:hover {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }
        button:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <div class="instructions">Move mouse to control boxing fists & punch SpongeBob • Click and drag to rotate view</div>
    <div id="canvas-container"></div>
    <div class="watermark">PI-SLICES</div>

    <div class="controls">
        <button onclick="powerPunch()">Power Punch</button>
        <button onclick="spinCharacter()">Spin Fast</button>
        <button onclick="explodeCharacter()">Explode</button>
        <button onclick="resetCharacter()">Reset</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        let scene, camera, renderer, controls;
        let snoopGroup, parts = [];
        let leftFist, rightFist;
        let actionState = 'normal';
        let actionTimer = 0;
        let mouse = new THREE.Vector2();
        let targetFistPos = new THREE.Vector3();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x010101);
            scene.fog = new THREE.FogExp2(0x010101, 0.03);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2.5, 7.5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.02;

            createGridFloor();
            createDenseSquareCity();
            createPedestal();
            createWireframeSpongeBob();
            createInteractiveFists();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);

            animate();
        }

        // רצפת רשת ענקית
        function createGridFloor() {
            const grid = new THREE.GridHelper(90, 90, 0x333333, 0x111111);
            grid.position.y = -1.5;
            scene.add(grid);
        }

        // עיר מרובעת עצומה וצפופה סביב
        function createDenseSquareCity() {
            const cityGroup = new THREE.Group();
            const buildingGeo = new THREE.BoxGeometry(1.6, 1, 1.6);
            const buildingMat = new THREE.MeshBasicMaterial({
                color: 0x222222,
                wireframe: true
            });

            const radiusSteps = [4, 7, 10, 13, 16];
            radiusSteps.forEach((r, index) => {
                const count = 8 + index * 4;
                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2;
                    const x = Math.cos(angle) * (r + (Math.random() * 1 - 0.5));
                    const z = Math.sin(angle) * (r + (Math.random() * 1 - 0.5));
                    
                    const height = Math.random() * 7 + 3;
                    const building = new THREE.Mesh(buildingGeo, buildingMat);
                    building.scale.set(1, height, 1);
                    building.position.set(x, -1.5 + height / 2, z);
                    cityGroup.add(building);
                }
            });

            scene.add(cityGroup);
        }

        // בסיס מרכזי משובץ
        function createPedestal() {
            const pedestalGroup = new THREE.Group();
            pedestalGroup.position.y = -1.5;

            const boxGeo = new THREE.BoxGeometry(1.5, 0.4, 1.5);
            const boxMat = new THREE.MeshBasicMaterial({ color: 0x020202 });
            const box = new THREE.Mesh(boxGeo, boxMat);
            pedestalGroup.add(box);

            const edgesGeo = new THREE.EdgesGeometry(boxGeo);
            const wireMat = new THREE.LineBasicMaterial({ color: 0xffffff });
            const wireBox = new THREE.LineSegments(edgesGeo, wireMat);
            pedestalGroup.add(wireBox);

            const gridHelper = new THREE.GridHelper(1.5, 5, 0xffffff, 0x444444);
            gridHelper.position.y = 0.21;
            pedestalGroup.add(gridHelper);

            scene.add(pedestalGroup);
        }

        // יצירת בוב ספוג במבנה Wireframe מפורט
        function createWireframeSpongeBob() {
            snoopGroup = new THREE.Group();
            parts = [];

            const material = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                wireframe: true,
                transparent: true,
                opacity: 0.95
            });

            function addPart(geo, x, y, z, rx = 0, ry = 0, rz = 0) {
                const mesh = new THREE.Mesh(geo, material);
                mesh.position.set(x, y, z);
                mesh.rotation.set(rx, ry, rz);
                mesh.userData = { 
                    origPos: new THREE.Vector3(x, y, z), 
                    origRot: new THREE.Euler(rx, ry, rz), 
                    vel: new THREE.Vector3() 
                };
                snoopGroup.add(mesh);
                parts.push(mesh);
                return mesh;
            }

            // גוף מלבני (הספוג עצמו)
            const bodyGeo = new THREE.BoxGeometry(1.0, 1.1, 0.6);
            addPart(bodyGeo, 0, 0.6, 0);

            // מכנסיים מרובעים
            const pantsGeo = new THREE.BoxGeometry(1.0, 0.35, 0.6);
            addPart(pantsGeo, 0, -0.05, 0);

            // רגליים
            const legGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.5, 6);
            addPart(legGeo, -0.25, -0.4, 0);
            addPart(legGeo, 0.25, -0.4, 0);

            // נעליים
            const shoeGeo = new THREE.BoxGeometry(0.2, 0.15, 0.3);
            addPart(shoeGeo, -0.25, -0.68, 0.05);
            addPart(shoeGeo, 0.25, -0.68, 0.05);

            snoopGroup.position.y = -0.3;
            scene.add(snoopGroup);
        }

        // יצירת כפפות אגרוף תלת-ממדיות שנשלטות על ידי העכבר שלך
        function createInteractiveFists() {
            const fistMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                wireframe: true
            });

            const fistGeo = new THREE.SphereGeometry(0.25, 8, 8);
            
            leftFist = new THREE.Mesh(fistGeo, fistMat);
            leftFist.position.set(-1.2, 0, 2);
            scene.add(leftFist);

            rightFist = new THREE.Mesh(fistGeo, fistMat);
            rightFist.position.set(1.2, 0, 2);
            scene.add(rightFist);
        }

        // מעקב אחר תנועות העכבר כדי לשלוט בידיים
        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // מיפוי מיקום העכבר למרחב התלת-ממד של הידיים
            targetFistPos.set(mouse.x * 2.5, mouse.y * 2.0 + 0.5, 1.5);
        }

        function powerPunch() {
            actionState = 'powerPunch';
            actionTimer = 0;
        }

        function spinCharacter() {
            actionState = 'spin';
            actionTimer = 0;
        }

        function explodeCharacter() {
            actionState = 'explode';
            actionTimer = 0;
            parts.forEach(p => {
                p.userData.vel.set(
                    (Math.random() - 0.5) * 0.3,
                    Math.random() * 0.25 + 0.1,
                    (Math.random() - 0.5) * 0.3
                );
            });
        }

        function resetCharacter() {
            actionState = 'normal';
            actionTimer = 0;
            snoopGroup.rotation.set(0, 0, 0);
            snoopGroup.position.set(0, -0.3, 0);
            parts.forEach(p => {
                p.position.copy(p.userData.origPos);
                p.rotation.copy(p.userData.origRot);
                p.userData.vel.set(0, 0, 0);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            actionTimer += 0.05;

            // תנועת הידיים בעקבות העכבר שלך עם ריכוך חלק (Lerp)
            if (leftFist && rightFist) {
                leftFist.position.lerp(new THREE.Vector3(targetFistPos.x - 0.5, targetFistPos.y, targetFistPos.z), 0.15);
                rightFist.position.lerp(new THREE.Vector3(targetFistPos.x + 0.5, targetFistPos.y, targetFistPos.z), 0.15);
                
                // סיבוב קל של האגרופים להמחשה
                leftFist.rotation.y += 0.03;
                rightFist.rotation.y -= 0.03;
            }

            if (actionState === 'normal') {
                snoopGroup.rotation.y += 0.01;
                snoopGroup.position.y = -0.3 + Math.sin(Date.now() * 0.004) * 0.04;
            } 
            else if (actionState === 'powerPunch') {
                // רעידה חזקה לבוב ספוג כאילו חוטף מכות מהידיים
                snoopGroup.rotation.z = Math.sin(actionTimer * 40) * 0.2;
                snoopGroup.position.x = Math.sin(actionTimer * 50) * 0.1;
                if (actionTimer > 1.8) resetCharacter();
            } 
            else if (actionState === 'spin') {
                snoopGroup.rotation.y += 0.35;
                if (actionTimer > 3) resetCharacter();
            } 
            else if (actionState === 'explode') {
                parts.forEach(p => {
                    p.position.add(p.userData.vel);
                    p.rotation.x += 0.12;
                    p.rotation.y += 0.12;
                });
            }

            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
