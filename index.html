<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe Human & Square City - GitHub Pages</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #010101;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .watermark {
            position: absolute;
            bottom: 25px;
            right: 30px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 13px;
            letter-spacing: 3px;
            pointer-events: none;
            text-transform: uppercase;
        }
        .instructions {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.45);
            font-size: 11px;
            letter-spacing: 2px;
            pointer-events: none;
            text-transform: uppercase;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(8, 8, 8, 0.95);
            padding: 14px 24px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(12px);
            z-index: 10;
        }
        button {
            background: #050505;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 10px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }
        button:hover {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }
        button:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <div class="instructions">Drag to rotate camera • Use action buttons below</div>
    <div id="canvas-container"></div>
    <div class="watermark">PI-SLICES</div>

    <div class="controls">
        <button onclick="punchCharacter()">Punch</button>
        <button onclick="spinCharacter()">Spin Fast</button>
        <button onclick="glitchCharacter()">Explode</button>
        <button onclick="resetCharacter()">Reset</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        let scene, camera, renderer, controls;
        let humanGroup, parts = [], rightArm, leftArm;
        let actionState = 'normal';
        let actionTimer = 0;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x010101);
            scene.fog = new THREE.FogExp2(0x010101, 0.035);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 7.5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.02;

            createGridFloor();
            createDenseSquareCity();
            createPedestal();
            createHumanWireframe();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        // רצפת רשת ענקית
        function createGridFloor() {
            const grid = new THREE.GridHelper(80, 80, 0x333333, 0x111111);
            grid.position.y = -1.5;
            scene.add(grid);
        }

        // יצירת עיר מרובעת צפופה ועצומה מסביב
        function createDenseSquareCity() {
            const cityGroup = new THREE.Group();
            const buildingGeo = new THREE.BoxGeometry(1.6, 1, 1.6);
            const buildingMat = new THREE.MeshBasicMaterial({
                color: 0x262626,
                wireframe: true
            });

            // פריסת בניינים מרובעים במעגלים סביב המרכז
            const radiusSteps = [4, 7, 10, 13];
            radiusSteps.forEach((r, index) => {
                const count = 8 + index * 4;
                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2;
                    const x = Math.cos(angle) * (r + (Math.random() * 1 - 0.5));
                    const z = Math.sin(angle) * (r + (Math.random() * 1 - 0.5));
                    
                    const height = Math.random() * 6 + 3;
                    const building = new THREE.Mesh(buildingGeo, buildingMat);
                    building.scale.set(1, height, 1);
                    building.position.set(x, -1.5 + height / 2, z);
                    cityGroup.add(building);
                }
            });

            scene.add(cityGroup);
        }

        // בסיס עמידה מרכזי
        function createPedestal() {
            const pedestalGroup = new THREE.Group();
            pedestalGroup.position.y = -1.5;

            const boxGeo = new THREE.BoxGeometry(1.4, 0.4, 1.4);
            const boxMat = new THREE.MeshBasicMaterial({ color: 0x020202 });
            const box = new THREE.Mesh(boxGeo, boxMat);
            pedestalGroup.add(box);

            const edgesGeo = new THREE.EdgesGeometry(boxGeo);
            const wireMat = new THREE.LineBasicMaterial({ color: 0xffffff });
            const wireBox = new THREE.LineSegments(edgesGeo, wireMat);
            pedestalGroup.add(wireBox);

            const gridHelper = new THREE.GridHelper(1.4, 4, 0xffffff, 0x444444);
            gridHelper.position.y = 0.21;
            pedestalGroup.add(gridHelper);

            scene.add(pedestalGroup);
        }

        // יצירת גוף האדם וידיים מדויקות שיוכלו לזוז ולהרביץ
        function createHumanWireframe() {
            humanGroup = new THREE.Group();
            parts = [];

            const material = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                wireframe: true,
                transparent: true,
                opacity: 0.95
            });

            function addPart(geo, x, y, z, rx = 0, ry = 0, rz = 0) {
                const mesh = new THREE.Mesh(geo, material);
                mesh.position.set(x, y, z);
                mesh.rotation.set(rx, ry, rz);
                mesh.userData = { 
                    origPos: new THREE.Vector3(x, y, z), 
                    origRot: new THREE.Euler(rx, ry, rz), 
                    vel: new THREE.Vector3() 
                };
                humanGroup.add(mesh);
                parts.push(mesh);
                return mesh;
            }

            // ראש
            const headGeo = new THREE.SphereGeometry(0.28, 8, 8);
            headGeo.scale(0.8, 1.1, 0.9);
            addPart(headGeo, 0, 1.7, 0);

            // צוואר
            const neckGeo = new THREE.CylinderGeometry(0.1, 0.12, 0.25, 6);
            addPart(neckGeo, 0, 1.35, 0);

            // חזה
            const torsoGeo = new THREE.ConeGeometry(0.4, 0.8, 8);
            torsoGeo.scale(1, 1, 0.6);
            addPart(torsoGeo, 0, 0.85, 0);

            // רגל עומדת
            const leg1Geo = new THREE.CylinderGeometry(0.1, 0.07, 1.3, 6);
            addPart(leg1Geo, -0.15, -0.5, 0);

            // רגל מקופלת
            const thighGeo = new THREE.CylinderGeometry(0.11, 0.09, 0.65, 6);
            addPart(thighGeo, 0.15, -0.25, 0.15, Math.PI / 3, 0, 0);

            const shinGeo = new THREE.CylinderGeometry(0.09, 0.06, 0.65, 6);
            addPart(shinGeo, 0.15, -0.65, 0.4, -Math.PI / 4, 0, 0);

            // ידיים נפרדות לשליטה באגרוף
            const armGeo = new THREE.CylinderGeometry(0.08, 0.06, 0.85, 6);
            
            // יד ימין
            rightArm = new THREE.Mesh(armGeo, material);
            rightArm.position.set(-0.38, 0.9, 0.1);
            rightArm.rotation.set(0, 0, Math.PI / 8);
            rightArm.userData = { origPos: rightArm.position.clone(), origRot: rightArm.rotation.clone(), vel: new THREE.Vector3() };
            humanGroup.add(rightArm);
            parts.push(rightArm);

            // יד שמאל (שנותנת את האגרוף)
            leftArm = new THREE.Mesh(armGeo, material);
            leftArm.position.set(0.38, 0.85, 0.2);
            leftArm.rotation.set(-Math.PI / 6, 0, -Math.PI / 8);
            leftArm.userData = { origPos: leftArm.position.clone(), origRot: leftArm.rotation.clone(), vel: new THREE.Vector3() };
            humanGroup.add(leftArm);
            parts.push(leftArm);

            humanGroup.position.y = -0.3;
            scene.add(humanGroup);
        }

        // פעולת אגרוף אמיתית - היד נשלחת קדימה במהירות וחוזרת
        function punchCharacter() {
            actionState = 'punch';
            actionTimer = 0;
        }

        function spinCharacter() {
            actionState = 'spin';
            actionTimer = 0;
        }

        function glitchCharacter() {
            actionState = 'glitch';
            actionTimer = 0;
            parts.forEach(p => {
                p.userData.vel.set(
                    (Math.random() - 0.5) * 0.25,
                    Math.random() * 0.2 + 0.05,
                    (Math.random() - 0.5) * 0.25
                );
            });
        }

        function resetCharacter() {
            actionState = 'normal';
            actionTimer = 0;
            humanGroup.rotation.set(0, 0, 0);
            humanGroup.position.set(0, -0.3, 0);
            parts.forEach(p => {
                p.position.copy(p.userData.origPos);
                p.rotation.copy(p.userData.origRot);
                p.userData.vel.set(0, 0, 0);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            actionTimer += 0.05;

            if (actionState === 'normal') {
                humanGroup.rotation.y += 0.008;
                humanGroup.position.y = -0.3 + Math.sin(Date.now() * 0.003) * 0.03;
            } 
            else if (actionState === 'punch') {
                // אגרוף קדימה עם יד שמאל ורטט בכל הגוף
                humanGroup.rotation.z = Math.sin(actionTimer * 35) * 0.12;
                leftArm.rotation.x = -Math.PI / 2 + Math.sin(actionTimer * 40) * 0.5;
                leftArm.position.z = 0.2 + Math.sin(actionTimer * 40) * 0.4;
                if (actionTimer > 1.8) resetCharacter();
            } 
            else if (actionState === 'spin') {
                humanGroup.rotation.y += 0.3;
                if (actionTimer > 3) resetCharacter();
            } 
            else if (actionState === 'glitch') {
                parts.forEach(p => {
                    p.position.add(p.userData.vel);
                    p.rotation.x += 0.1;
                    p.rotation.y += 0.1;
                });
            }

            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
