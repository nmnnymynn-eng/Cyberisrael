<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe Sphere & Figure - GitHub Pages</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: monospace;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .watermark {
            position: absolute;
            bottom: 20px;
            right: 25px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            letter-spacing: 2px;
            pointer-events: none;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="watermark">PI-SLICES</div>

    <!-- טעינת Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, worldGroup, sphere, figureGroup;

        function init() {
            // יצירת סצנה
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            // יצירת מצלמה בזווית אלכסונית מלמעלה בדיוק כמו בתמונה
            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 9);
            camera.lookAt(0, -0.5, 0);

            // יצירת רנדרר
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // קבוצה ראשית שזזה יחד (כדי ליצור אשליה של התקדמות)
            worldGroup = new THREE.Group();
            scene.add(worldGroup);

            // יצירת הרשת התחתונה (Grid) שנמתחת לאופק כמו בתמונה
            createPerspectiveGrid();

            // יצירת כדור המשולשים הגדול
            createTriangulatedSphere();

            // יצירת דמות האדם שעומדת על הכדור
            createFigureOnSphere();

            // האזנה לשינויי גודל המסך
            window.addEventListener('resize', onWindowResize);

            // הרצת לולאת האנימציה
            animate();
        }

        // יצירת רשת הקרקע הפרספקטיבית
        function createPerspectiveGrid() {
            const gridHelper = new THREE.GridHelper(30, 20, 0xffffff, 0xffffff);
            gridHelper.position.y = -2.2;
            gridHelper.position.z = -5;
            // הטיית הרשת קצת קדימה ליצירת עומק
            gridHelper.rotation.x = 0.1;
            worldGroup.add(gridHelper);
        }

        // יצירת הכדור הענק העשוי רשת משולשים
        function createTriangulatedSphere() {
            // שימוש ב-IcosahedronGeometry כדי לקבל בדיוק מבנה של משולשים על הכדור כמו בתמונה
            const sphereGeo = new THREE.IcosahedronGeometry(2.0, 3);
            
            const wireMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                wireframe: true,
                transparent: true,
                opacity: 0.85
            });

            sphere = new THREE.Mesh(sphereGeo, wireMat);
            sphere.position.set(0, -0.2, 0);
            worldGroup.add(sphere);
        }

        // יצירת הדמות בדיוק במצב עמידה על ראש הכדור
        function createFigureOnSphere() {
            figureGroup = new THREE.Group();

            const mat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                wireframe: true
            });

            // ראש
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.15, 6, 6), mat);
            head.position.set(0, 1.85, 0);
            figureGroup.add(head);

            // פלג גוף עליון
            const torso = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.5, 6), mat);
            torso.position.set(0, 1.5, 0);
            figureGroup.add(torso);

            // רגל עומדת (ישרה על הכדור)
            const leg1 = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.04, 0.7, 5), mat);
            leg1.position.set(0, 1.05, 0);
            figureGroup.add(leg1);

            // רגל מקופלת באוויר
            const thigh2 = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.35, 5), mat);
            thigh2.position.set(0.12, 1.25, 0.15);
            thigh2.rotation.x = Math.PI / 3;
            figureGroup.add(thigh2);

            const shin2 = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.03, 0.35, 5), mat);
            shin2.position.set(0.12, 1.0, 0.35);
            shin2.rotation.x = -Math.PI / 4;
            figureGroup.add(shin2);

            // ידיים
            const arm1 = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.03, 0.45, 5), mat);
            arm1.position.set(-0.2, 1.55, 0);
            arm1.rotation.z = Math.PI / 6;
            figureGroup.add(arm1);

            const arm2 = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.03, 0.45, 5), mat);
            arm2.position.set(0.2, 1.5, 0.1);
            arm2.rotation.x = -Math.PI / 4;
            figureGroup.add(arm2);

            // מיקום מדויק של הדמות כך שתעמוד בדיוק בחלקו העליון של הכדור
            figureGroup.position.set(0, 1.7, 0);
            
            // הוספת הדמות לכדור כך שהיא תסתובב יחד איתו
            sphere.add(figureGroup);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // אנימציית גלגול הכדור וסיבוב הסצנה בדיוק כמו בגיפ
        function animate() {
            requestAnimationFrame(animate);

            // גלגול הכדור סביב ציר Z ו-X כך שייראה שהוא מתגלגל קדימה ושמאלה
            sphere.rotation.z -= 0.015;
            sphere.rotation.x += 0.005;

            // סיבוב קל של כל העולם לצדדים כדי לתת תחושת תנועה מרחבית
            worldGroup.rotation.y = Math.sin(Date.now() * 0.001) * 0.2;

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
