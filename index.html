<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Wireframe Human - GitHub Pages</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: monospace;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .watermark {
            position: absolute;
            bottom: 20px;
            right: 25px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            letter-spacing: 2px;
            pointer-events: none;
            text-transform: uppercase;
        }
        /* לוח כפתורי שליטה אינטראקטיביים */
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(20, 20, 20, 0.85);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        button {
            background: #111;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-family: monospace;
            font-size: 14px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        button:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255,255,255,0.2);
        }
        button:active {
            transform: translateY(0);
        }
        .instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            letter-spacing: 1px;
            pointer-events: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="instructions">גרור עם העכבר כדי לסובב את הדמות • השתמש בכפתורים למטה כדי להפעיל עליה פעולות</div>
    <div id="canvas-container"></div>
    <div class="watermark">PI-SLICES</div>

    <!-- לוח הבקרה עם הכפתורים -->
    <div class="controls">
        <button onclick="punchCharacter()">💥 תן אגרוף</button>
        <button onclick="spinCharacter()">🔄 סובב מהר</button>
        <button onclick="glitchCharacter()">⚡ פיצוץ / התפרקות</button>
        <button onclick="resetCharacter()">✨ שחזר דמות</button>
    </div>

    <!-- טעינת Three.js וספרית עזר לשליטה בעכבר (OrbitControls) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        let scene, camera, renderer, controls;
        let humanGroup, parts = [];
        let isAnimating = true;
        let actionState = 'normal';
        let actionTimer = 0;

        function init() {
            // יצירת סצנה
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            // יצירת מצלמה
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.5, 6);

            // יצירת רנדרר
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // הוספת יכולת סיבוב עם העכבר
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // יצירת הבסיס
            createPedestal();

            // יצירת הדמות המדויקת מרשת משולשים
            createHumanWireframe();

            // האזנה לשינויי חלון
            window.addEventListener('resize', onWindowResize);

            // לולאת אנימציה ראשית
            animate();
        }

        // בניית הבסיס המשובץ כמו בתמונה
        function createPedestal() {
            const pedestalGroup = new THREE.Group();
            pedestalGroup.position.y = -1.5;

            const boxGeo = new THREE.BoxGeometry(1.2, 0.4, 1.2);
            const boxMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const box = new THREE.Mesh(boxGeo, boxMat);
            pedestalGroup.add(box);

            const edgesGeo = new THREE.EdgesGeometry(boxGeo);
            const wireMat = new THREE.LineBasicMaterial({ color: 0xffffff });
            const wireBox = new THREE.LineSegments(edgesGeo, wireMat);
            pedestalGroup.add(wireBox);

            const gridHelper = new THREE.GridHelper(1.2, 3, 0xffffff, 0xffffff);
            gridHelper.position.y = 0.21;
            scene.add(pedestalGroup);
        }

        // יצירת גוף האדם מרשת משולשים מפורטת
        function createHumanWireframe() {
            humanGroup = new THREE.Group();
            parts = [];

            const material = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                wireframe: true,
                transparent: true,
                opacity: 0.95
            });

            // פונקציית עזר ליצירת חלק ושמירתו לאנימציות
            function addPart(geo, x, y, z, rx = 0, ry = 0, rz = 0) {
                const mesh = new THREE.Mesh(geo, material);
                mesh.position.set(x, y, z);
                mesh.rotation.set(rx, ry, rz);
                // שמירת המיקום המקורי לאיפוס
                mesh.userData = { origPos: new THREE.Vector3(x, y, z), origRot: new THREE.Euler(rx, ry, rz), vel: new THREE.Vector3() };
                humanGroup.add(mesh);
                parts.push(mesh);
                return mesh;
            }

            // ראש
            const headGeo = new THREE.SphereGeometry(0.28, 8, 8);
            headGeo.scale(0.8, 1.1, 0.9);
            addPart(headGeo, 0, 1.7, 0);

            // צוואר
            const neckGeo = new THREE.CylinderGeometry(0.1, 0.12, 0.25, 6);
            addPart(neckGeo, 0, 1.35, 0);

            // חזה / פלג גוף עליון
            const torsoGeo = new THREE.ConeGeometry(0.4, 0.8, 8);
            torsoGeo.scale(1, 1, 0.6);
            addPart(torsoGeo, 0, 0.85, 0);

            // רגל עומדת (ישרה)
            const leg1Geo = new THREE.CylinderGeometry(0.1, 0.07, 1.3, 6);
            addPart(leg1Geo, -0.15, -0.5, 0);

            // רגל מקופלת (תאנה ווקטורים כמו בתמונה)
            const thighGeo = new THREE.CylinderGeometry(0.11, 0.09, 0.65, 6);
            addPart(thighGeo, 0.15, -0.25, 0.15, Math.PI / 3, 0, 0);

            const shinGeo = new THREE.CylinderGeometry(0.09, 0.06, 0.65, 6);
            addPart(shinGeo, 0.15, -0.65, 0.4, -Math.PI / 4, 0, 0);

            // ידיים
            const armGeo = new THREE.CylinderGeometry(0.08, 0.06, 0.85, 6);
            addPart(armGeo, -0.38, 0.9, 0.1, 0, 0, Math.PI / 8);   // יד ימין
            addPart(armGeo, 0.38, 0.85, 0.2, -Math.PI / 6, 0, -Math.PI / 8); // יד שמאל

            humanGroup.position.y = -0.3;
            scene.add(humanGroup);
        }

        // כפתור 1: מתן אגרוף (הדמות רועדת וזזה מעוצמה)
        function punchCharacter() {
            actionState = 'punch';
            actionTimer = 0;
        }

        // כפתור 2: סיבוב מהיר סביב עצמו
        function spinCharacter() {
            actionState = 'spin';
            actionTimer = 0;
        }

        // כפתור 3: פיצוץ / התפרקות החלקים לכל עבר
        function glitchCharacter() {
            actionState = 'glitch';
            actionTimer = 0;
            parts.forEach(p => {
                p.userData.vel.set(
                    (Math.random() - 0.5) * 0.15,
                    Math.random() * 0.1 + 0.05,
                    (Math.random() - 0.5) * 0.15
                );
            });
        }

        // כפתור 4: שחזור מלא למצב המקורי
        function resetCharacter() {
            actionState = 'normal';
            actionTimer = 0;
            humanGroup.rotation.set(0, 0, 0);
            humanGroup.position.set(0, -0.3, 0);
            parts.forEach(p => {
                p.position.copy(p.userData.origPos);
                p.rotation.copy(p.userData.origRot);
                p.userData.vel.set(0, 0, 0);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // לולאת האנימציה הראשית
        function animate() {
            requestAnimationFrame(animate);
            actionTimer += 0.05;

            if (actionState === 'normal') {
                // סיבוב איטי קבוע ותנועת ריחוף עדינה בדיוק כמו בגיפ
                humanGroup.rotation.y += 0.008;
                humanGroup.position.y = -0.3 + Math.sin(Date.now() * 0.003) * 0.03;
            } 
            else if (actionState === 'punch') {
                // אפקט רעידת אגרוף
                humanGroup.rotation.z = Math.sin(actionTimer * 30) * 0.15;
                humanGroup.position.x = Math.sin(actionTimer * 40) * 0.08;
                if (actionTimer > 1.5) resetCharacter();
            } 
            else if (actionState === 'spin') {
                // סיבוב מהיר מאוד סביב הציר
                humanGroup.rotation.y += 0.2;
                if (actionTimer > 3) resetCharacter();
            } 
            else if (actionState === 'glitch') {
                // פיזור החלקים באוויר
                parts.forEach(p => {
                    p.position.add(p.userData.vel);
                    p.rotation.x += 0.05;
                    p.rotation.y += 0.05;
                });
            }

            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
