<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">wireframe human sculpture - github pages</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: monospace;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .watermark {
            position: absolute;
            bottom: 20px;
            right: 25px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            letter-spacing: 2px;
            pointer-events: none;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="watermark">PI-SLICES</div>

    <!-- טעינת Three.js וספריות נלוות -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, sculptureGroup;

        function init() {
            // יצירת סצנה
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            // יצירת מצלמה
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 7);
            camera.lookAt(0, 0, 0);

            // יצירת רנדרר
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // קבוצת הפסל (דמות + בסיס)
            sculptureGroup = new THREE.Group();
            scene.add(sculptureGroup);

            // בניית הבסיס המשובץ
            createPedestal();

            // בניית דמות אדם מדויקת מרשת משולשים
            createHumanWireframeSculpture();

            // התאמה לשינויי גודל במסך
            window.addEventListener('resize', onWindowResize);

            // הרצת הלולאה הראשית
            animate();
        }

        // יצירת הבסיס הריבועי המשובץ בדיוק כמו בתמונה
        function createPedestal() {
            const pedestalGroup = new THREE.Group();
            pedestalGroup.position.y = -1.5;

            // קוביית הבסיס השחורה
            const boxGeo = new THREE.BoxGeometry(1.2, 0.4, 1.2);
            const boxMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const box = new THREE.Mesh(boxGeo, boxMat);
            pedestalGroup.add(box);

            // קווים לבנים יוצרים משבצות על הבסיס
            const edgesGeo = new THREE.EdgesGeometry(boxGeo);
            const wireMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 1 });
            const wireBox = new THREE.LineSegments(edgesGeo, wireMat);
            pedestalGroup.add(wireBox);

            // חלוקה פנימית למשבצות על גבי המשטח העליון
            const gridHelper = new THREE.GridHelper(1.2, 3, 0xffffff, 0xffffff);
            gridHelper.position.y = 0.21;
            pedestalGroup.add(gridHelper);

            sculptureGroup.add(pedestalGroup);
        }

        // יצירת מבנה גוף האדם מרשת משולשים (Wireframe)
        function createHumanWireframeSculpture() {
            const material = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                wireframe: true,
                transparent: true,
                opacity: 0.9
            });

            // ראש
            const headGeo = new THREE.SphereGeometry(0.3, 7, 7);
            headGeo.scale(0.8, 1.1, 0.9);
            const head = new THREE.Mesh(headGeo, material);
            head.position.set(0, 1.8, 0);
            sculptureGroup.add(head);

            // צוואר
            const neckGeo = new THREE.CylinderGeometry(0.12, 0.15, 0.3, 6);
            const neck = new THREE.Mesh(neckGeo, material);
            neck.position.set(0, 1.35, 0);
            sculptureGroup.add(neck);

            // פלג גוף עליון (חזה וכתפיים)
            const torsoGeo = new THREE.ConeGeometry(0.45, 0.9, 8);
            torsoGeo.scale(1, 1, 0.6);
            const torso = new THREE.Mesh(torsoGeo, material);
            torso.position.set(0, 0.8, 0);
            sculptureGroup.add(torso);

            // רגל עומדת (ישרה למטה אל הבסיס)
            const standingLegGeo = new THREE.CylinderGeometry(0.12, 0.08, 1.4, 6);
            const standingLeg = new THREE.Mesh(standingLegGeo, material);
            standingLeg.position.set(-0.15, -0.6, 0);
            sculptureGroup.add(standingLeg);

            // רגל מקופלת (כמו בתמונה)
            const thighGeo = new THREE.CylinderGeometry(0.13, 0.1, 0.7, 6);
            const thigh = new THREE.Mesh(thighGeo, material);
            thigh.position.set(0.15, -0.3, 0.2);
            thigh.rotation.x = Math.PI / 3;
            sculptureGroup.add(thigh);

            const shinGeo = new THREE.CylinderGeometry(0.1, 0.07, 0.7, 6);
            const shin = new THREE.Mesh(shinGeo, material);
            shin.position.set(0.15, -0.7, 0.45);
            shin.rotation.x = -Math.PI / 4;
            sculptureGroup.add(shin);

            // ידיים
            const armGeo = new THREE.CylinderGeometry(0.09, 0.07, 0.9, 6);
            
            // יד ימין (יורדת לצד הגוף)
            const rightArm = new THREE.Mesh(armGeo, material);
            rightArm.position.set(-0.4, 0.9, 0.1);
            rightArm.rotation.z = Math.PI / 8;
            sculptureGroup.add(rightArm);

            // יד שמאל (מושטת קדימה מעט)
            const leftArm = new THREE.Mesh(armGeo, material);
            leftArm.position.set(0.4, 0.85, 0.2);
            leftArm.rotation.x = -Math.PI / 6;
            leftArm.rotation.z = -Math.PI / 8;
            sculptureGroup.add(leftArm);

      // התאמת מיקום כללי של הפסל מעל הבסיס
      sculptureGroup.position.y = -0.3;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // אנימציית סיבוב איטי ותנועה עדינה של הדמות בדיוק כמו בגיפ המקורי
        function animate() {
            requestAnimationFrame(animate);

            // סיבוב איטי סביב הציר כדי שיראו את כל התלת-ממד
            sculptureGroup.rotation.y += 0.008;

            // תנועת נדנוד קטנה ועדינה (ריחוף/נשימה) כמו בגיפ
            sculptureGroup.position.y = -0.3 + Math.sin(Date.now() * 0.003) * 0.03;

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
