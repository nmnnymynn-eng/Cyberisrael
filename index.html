<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe SpongeBob - Anime Punch Cinematic</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .watermark {
            position: absolute;
            bottom: 20px;
            right: 25px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 13px;
            letter-spacing: 3px;
            pointer-events: none;
            text-transform: uppercase;
        }
        .instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            letter-spacing: 2px;
            pointer-events: none;
            text-transform: uppercase;
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 10px 20px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }
        .controls {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(5, 5, 5, 0.95);
            padding: 12px 20px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        button {
            background: #000000;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
            transition: all 0.15s ease;
        }
        button:hover {
            background: #ffffff;
            color: #000000;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
        }
        button:active {
            transform: scale(0.95);
        }
        #impact-banner {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0) rotate(-10deg);
            color: #ffffff;
            font-size: 56px;
            font-weight: 900;
            letter-spacing: 8px;
            pointer-events: none;
            text-shadow: 0 0 30px #ffffff, 0 0 10px #ffffff;
            opacity: 0;
            transition: transform 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.15s ease-out;
            z-index: 20;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="instructions">Click SpongeBob or press Punch for anime cinematic impact camera</div>
    <div id="impact-banner">ANIME IMPACT!</div>
    <div id="canvas-container"></div>
    <div class="watermark">PI-SLICES</div>

    <div class="controls">
        <button onclick="triggerAnimePunch()">Punch</button>
        <button onclick="spinCharacter()">Hyper Spin</button>
        <button onclick="shatterCharacter()">Shatter</button>
        <button onclick="resetCharacter()">Reset</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        let scene, camera, renderer, controls;
        let spongeGroup, parts = [];
        let giantFist, shockwaves = [];
        let actionState = 'normal';
        let actionTimer = 0;
        let currentHitType = 0;
        let shakeIntensity = 0;

        // מצלמה קולנועית
        let cameraTargetPos = new THREE.Vector3(0, 2, 8);
        let cameraDefaultPos = new THREE.Vector3(0, 2, 8);

        const ANIME_TITLES = ["K.O.!", "SUPER IMPACT!", "FATAL BLOW!", "ANIME SMASH!", "ULTIMATE HIT!"];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            scene.fog = new THREE.FogExp2(0x000000, 0.025);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(cameraDefaultPos);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            createGridFloor();
            createSquareCity();
            createPedestal();
            createSpongeBob();
            createBlockyFist();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('click', onCanvasClick);

            animate();
        }

        function createGridFloor() {
            const grid = new THREE.GridHelper(100, 100, 0x444444, 0x111111);
            grid.position.y = -1.5;
            scene.add(grid);
        }

        function createSquareCity() {
            const cityGroup = new THREE.Group();
            const bGeo = new THREE.BoxGeometry(1.8, 1, 1.8);
            const bMat = new THREE.MeshBasicMaterial({ color: 0x222222, wireframe: true });

            for (let r = 5; r <= 20; r += 3) {
                const count = r * 3;
                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2;
                    const x = Math.cos(angle) * r;
                    const z = Math.sin(angle) * r;
                    const h = Math.random() * 8 + 3;
                    
                    const building = new THREE.Mesh(bGeo, bMat);
                    building.scale.set(1, h, 1);
                    building.position.set(x, -1.5 + h / 2, z);
                    cityGroup.add(building);
                }
            }
            scene.add(cityGroup);
        }

        function createPedestal() {
            const pGroup = new THREE.Group();
            pGroup.position.y = -1.5;

            const box = new THREE.Mesh(
                new THREE.BoxGeometry(1.6, 0.4, 1.6),
                new THREE.MeshBasicMaterial({ color: 0x050505 })
            );
            pGroup.add(box);

            const edges = new THREE.LineSegments(
                new THREE.EdgesGeometry(box.geometry),
                new THREE.LineBasicMaterial({ color: 0xffffff })
            );
            pGroup.add(edges);

            const grid = new THREE.GridHelper(1.6, 6, 0xffffff, 0x333333);
            grid.position.y = 0.201;
            pGroup.add(grid);

            scene.add(pGroup);
        }

        function createSpongeBob() {
            spongeGroup = new THREE.Group();
            parts = [];

            const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });

            function addPart(geo, x, y, z, rx = 0, ry = 0, rz = 0) {
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, y, z);
                mesh.rotation.set(rx, ry, rz);
                mesh.userData = { 
                    origPos: new THREE.Vector3(x, y, z), 
                    origRot: new THREE.Euler(rx, ry, rz), 
                    vel: new THREE.Vector3() 
                };
                spongeGroup.add(mesh);
                parts.push(mesh);
                return mesh;
            }

            addPart(new THREE.BoxGeometry(1.1, 1.1, 0.6), 0, 0.6, 0);
            addPart(new THREE.BoxGeometry(1.1, 0.35, 0.61), 0, -0.05, 0);
            addPart(new THREE.BoxGeometry(0.25, 0.25, 0.1), -0.22, 0.75, 0.32);
            addPart(new THREE.BoxGeometry(0.25, 0.25, 0.1), 0.22, 0.75, 0.32);
            addPart(new THREE.BoxGeometry(0.12, 0.25, 0.05), 0, 0.05, 0.32);
            addPart(new THREE.BoxGeometry(0.12, 0.5, 0.12), -0.25, -0.4, 0);
            addPart(new THREE.BoxGeometry(0.12, 0.5, 0.12), 0.25, -0.4, 0);
            addPart(new THREE.BoxGeometry(0.22, 0.15, 0.35), -0.25, -0.68, 0.08);
            addPart(new THREE.BoxGeometry(0.22, 0.15, 0.35), 0.25, -0.68, 0.08);

            spongeGroup.position.y = -0.3;
            scene.add(spongeGroup);
        }

        function createBlockyFist() {
            giantFist = new THREE.Group();
            const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });

            const palm = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.7, 0.6), mat);
            giantFist.add(palm);

            for (let i = 0; i < 4; i++) {
                const finger = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.35, 0.3), mat);
                finger.position.set(-0.3 + i * 0.2, -0.35, 0.2);
                giantFist.add(finger);
            }

            const thumb = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, 0.25), mat);
            thumb.position.set(0.48, -0.1, 0.1);
            giantFist.add(thumb);

            giantFist.position.set(0, 0, 18);
            scene.add(giantFist);
        }

        function createShockwaveRing(position) {
            const geo = new THREE.RingGeometry(0.1, 0.4, 16);
            const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, side: THREE.DoubleSide });
            const ring = new THREE.Mesh(geo, mat);
            ring.position.copy(position);
            ring.rotation.x = Math.PI / 2;
            scene.add(ring);
            shockwaves.push({ mesh: ring, scale: 0.1, opacity: 1.0 });
        }

        function triggerAnimePunch() {
            actionState = 'animePunch';
            actionTimer = 0;
            currentHitType = Math.floor(Math.random() * 5);

            // איפוס מיקום האגרוף לזנקה קולנועית
            giantFist.position.set(0, 0.5, 6);

            // הצגת באנר אנימה
            const banner = document.getElementById('impact-banner');
            banner.innerText = ANIME_TITLES[currentHitType];
            banner.style.transform = 'translate(-50%, -50%) scale(1.3) rotate(3deg)';
            banner.style.opacity = '1';

            setTimeout(() => {
                banner.style.transform = 'translate(-50%, -50%) scale(0) rotate(-10deg)';
                banner.style.opacity = '0';
            }, 700);
        }

        function spinCharacter() {
            actionState = 'spin';
            actionTimer = 0;
        }

        function shatterCharacter() {
            actionState = 'shatter';
            actionTimer = 0;
            parts.forEach(p => {
                p.userData.vel.set(
                    (Math.random() - 0.5) * 0.4,
                    Math.random() * 0.3 + 0.1,
                    (Math.random() - 0.5) * 0.4
                );
            });
        }

        function resetCharacter() {
            actionState = 'normal';
            actionTimer = 0;
            giantFist.position.set(0, 0, 18);
            spongeGroup.rotation.set(0, 0, 0);
            spongeGroup.position.set(0, -0.3, 0);
            camera.position.copy(cameraDefaultPos);
            parts.forEach(p => {
                p.position.copy(p.userData.origPos);
                p.rotation.copy(p.userData.origRot);
                p.userData.vel.set(0, 0, 0);
            });
        }

        function onCanvasClick(e) {
            if (e.target.tagName !== 'BUTTON') {
                triggerAnimePunch();
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            actionTimer += 0.05;

            // עדכון רעידות מסך
            if (shakeIntensity > 0) {
                camera.position.x += (Math.random() - 0.5) * shakeIntensity;
                camera.position.y += (Math.random() - 0.5) * shakeIntensity;
                shakeIntensity *= 0.85;
            }

            // עדכון גלי הדף
            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const sw = shockwaves[i];
                sw.scale += 0.5;
                sw.mesh.scale.set(sw.scale, sw.scale, sw.scale);
                sw.opacity -= 0.04;
                if (sw.opacity <= 0) {
                    scene.remove(sw.mesh);
                    shockwaves.splice(i, 1);
                }
            }

            if (actionState === 'normal') {
                spongeGroup.rotation.y += 0.01;
                spongeGroup.position.y = -0.3 + Math.sin(Date.now() * 0.004) * 0.04;
            } 
            else if (actionState === 'animePunch') {
                // שלב 1: זום-אין דרמטי של המצלמה אל תוך הפנים של בוב ספוג + טסת האגרוף במהירות מטורפת
                if (actionTimer < 0.2) {
                    giantFist.position.z -= 1.2;
                    camera.position.lerp(new THREE.Vector3(0, 0.5, 1.8), 0.25);
                } 
                // שלב 2: רגע הפגיעה האנרגטי (Impact Frame) - רעידת אדמה, גל הדף וזום-אוט אלים
                else if (actionTimer >= 0.2 && actionTimer < 0.25) {
                    createShockwaveRing(spongeGroup.position);
                    shakeIntensity = 0.7;
                    camera.position.set(0, 2.5, 6); // זום-אוט פתאומי כמו באנימה
                } 
                // שלב 3: אנימציית תגובה פסיכית לבוב ספוג בהתאם לסוג המכה שנבחר
                else if (actionTimer >= 0.25) {
                    giantFist.position.z += 0.8;

                    if (currentHitType === 0) { // K.O. BACKFLIP
                        spongeGroup.rotation.x += 0.35;
                        spongeGroup.position.y += 0.2;
                    } 
                    else if (currentHitType === 1) { // SUPER IMPACT STRETCH
                        spongeGroup.rotation.y += 0.5;
                        spongeGroup.scale.set(1.5, 0.5, 1.5);
                    } 
                    else if (currentHitType === 2) { // FATAL BLOW SPIN
                        spongeGroup.rotation.z += 0.4;
                        spongeGroup.position.x = Math.sin(actionTimer * 30) * 0.2;
                    } 
                    else if (currentHitType === 3) { // ANIME SMASH VIBRATION
                        spongeGroup.position.x = (Math.random() - 0.5) * 0.4;
                        spongeGroup.rotation.y += 0.3;
                    } 
                    else if (currentHitType === 4) { // ULTIMATE LAUNCH
                        spongeGroup.position.y += 0.25;
                        spongeGroup.rotation.x -= 0.4;
                    }

                    if (actionTimer > 2.2) resetCharacter();
                }
            } 
            else if (actionState === 'spin') {
                spongeGroup.rotation.y += 0.6;
                if (actionTimer > 2.5) resetCharacter();
            } 
            else if (actionState === 'shatter') {
                parts.forEach(p => {
                    p.position.add(p.userData.vel);
                    p.rotation.x += 0.15;
                    p.rotation.y += 0.15;
                });
            }

            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
